[project]
name = "app"
version = "0.1.0"
description = "StockNews backend API"
readme = "README.md"
authors = [
    { name = "Roman Cirier", email = "roman.cirier@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-env>=1.8.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "F",  # pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "TID252", # relative imports
    "TID251", # banned imports
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"app.modules".msg = "core/ must not import from modules/."

[tool.ruff.lint.per-file-ignores]
# The app.modules ban applies only inside core/.
"!src/app/core/**" = ["TID251"]

[tool.pyright]
include = ["src", "tests", "migrations"]
strict = ["src"]

[tool.pytest]
testpaths = ["tests"]

[tool.pytest_env]
ENVIRONMENT = "test"
DATABASE_URL = "postgresql+asyncpg://stocknews:stocknews@localhost:5432/stocknews_test"
JWT_SECRET = "test-secret-not-used-anywhere-else-0123456789"
