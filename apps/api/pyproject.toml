[project]
name = "app"
version = "0.1.0"
description = "StockNews backend API"
readme = "README.md"
authors = [
    { name = "Roman Cirier", email = "roman.cirier@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiolimiter>=1.3.0",
    "alembic>=1.20.0",
    "anthropic>=2.3.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "feedparser>=6.0.14",
    "httpx2>=2.16.0",
    "pandas>=3.1.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pandas-stubs>=3.0.5.260914",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-env>=1.8.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
# First-party code is what `src/` holds, also for the ruff.toml files below it.
src = ["src"]

[tool.ruff.lint]
select = [
    "F",  # pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "TID252", # relative imports
    "TID251", # banned imports
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
# The one-way import bans (TID251) are in the ruff.toml of src/app/core/ and
# src/app/integrations/.

[tool.pyright]
include = ["src", "tests", "migrations", "scripts"]
strict = ["src"]

[tool.pytest]
testpaths = ["tests"]

[tool.pytest_env]
ENVIRONMENT = "test"
DATABASE_URL = "postgresql+asyncpg://stocknews:stocknews@localhost:5432/stocknews_test"
JWT_SECRET = "test-secret-not-used-anywhere-else-0123456789"
